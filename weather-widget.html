<div
  id="weather-widget"
  class="weather-widget"
  aria-live="polite"
  aria-atomic="true"
  aria-label="Información del clima actual"
>
  <div class="weather-widget__main">
    <i id="weather-icon" class="fas fa-location-dot" aria-hidden="true"></i>
    <span id="weather-text" class="weather-widget__temp">--°C</span>
  </div>

  <span id="weather-city" class="weather-widget__city">Ubicando...</span>
</div>
